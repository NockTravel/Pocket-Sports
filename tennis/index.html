.pt-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.pt-name{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-sets{font-variant-numeric:tabular-nums;opacity:.8;font-size:13px;min-width:54px;text-align:right}

.pt-pts{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;width:30px;text-align:center;color:#e8f24a}
.pt-serve{opacity:1}.pt-noserve .pt-dot{opacity:.25}
.pt-msg{position:absolute;top:34%;left:0;right:0;text-align:center;font-weight:800;font-size:30px;letter-spacing:.5px;text-shadow:0 3px 14px rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.pt-msg .sub{display:block;font-size:15px;font-weight:600;opacity:.85;margin-top:4px;letter-spacing:0}
.pt-ring{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:84px;height:84px;opacity:0;transition:opacity .12s}
.pt-hint{position:absolute;bottom:env(safe-area-inset-bottom,10px);left:0;right:0;text-align:center;font-size:13px;opacity:.72;margin-bottom:10px;padding:0 20px}

.pt-btn:active{transform:scale(.96)}
.pt-overlay{position:absolute;inset:0;pointer-events:auto;background:radial-gradient(120% 90% at 50% 10%,rgba(14,44,74,.96),rgba(4,12,22,.98));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto}
.pt-title{font-size:40px;font-weight:900;letter-spacing:1px;margin:0 0 2px}
.pt-title .ball{color:#e8f24a}
.pt-tag{opacity:.75;font-size:14px;margin-bottom:18px}
.pt-label{align-self:flex-start;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;margin:14px 0 8px}
.pt-courts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}

.pt-cn{font-weight:700;font-size:15px}
.pt-cb{opacity:.72;font-size:12px;margin-top:2px}
.pt-badge{font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:2px 6px;border-radius:5px;margin-left:6px;background:rgba(232,242,74,.18);color:#e8f24a}
.pt-diffs{display:flex;gap:8px;width:100%;max-width:420px;margin-top:4px}
.pt-diff{flex:1;pointer-events:auto;text-align:center;background:rgba(8,26,44,.8);border:1px solid rgba(120,160,200,.22);border-radius:10px;padding:10px;cursor:pointer;font-weight:700}
.pt-diff.sel{border-color:#e8f24a;background:rgba(40,60,30,.5)}
.pt-play{pointer-events:auto;margin-top:22px;background:#e8f24a;color:#0a2036;border:none;border-radius:12px;padding:14px 48px;font-size:18px;font-weight:900;cursor:pointer;letter-spacing:.5px}
.pt-play:active{transform:scale(.97)}
.pt-fade{opacity:0 !important}
